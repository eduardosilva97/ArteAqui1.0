<ion-header>

  <ion-navbar color = "primary">
    <ion-title>{{ title }}</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding>
<div class="conteudo-limitado">

  <form [formGroup] = "form">

      <ion-item>
        <ion-label stacked>Nome do evento *</ion-label>
        <ion-input type="text" formControlName="eventoNome"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label stacked>Categoria *</ion-label>
        <ion-select formControlName="categoria" interface="popover">
          <ion-option *ngFor="let c of categorias" [value]="c.chave">{{ c.nome }}</ion-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-label stacked>Descrição</ion-label>
        <ion-textarea formControlName="descricao" rows="3"></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-label stacked>Data</ion-label>
        <ion-input type="date" formControlName="date"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label stacked>Horário ou frequência</ion-label>
        <ion-input type="text" formControlName="quando" placeholder="Ex.: sábados às 18h"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label stacked>Preço (R$, 0 = grátis)</ion-label>
        <ion-input type="number" formControlName="preco"></ion-input>
      </ion-item>

      <ion-item>
         <ion-label stacked>Local *</ion-label>
          <ion-input type="text" formControlName="local"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label stacked>Classificação indicativa (anos)</ion-label>
        <ion-input type="number" formControlName="classificacao"></ion-input>
      </ion-item>

      <ion-item>
            <ion-label stacked>Latitude e longitude *</ion-label>
            <ion-input type="text" formControlName="latlng" placeholder="-12.9714, -38.5108"></ion-input>
            <button ion-button clear item-end type="button" (click)="usarMinhaLocalizacao()">
              <ion-icon name="locate"></ion-icon>
            </button>
      </ion-item>
      <ion-item *ngIf="form.get('latlng').errors?.latlng && form.get('latlng').touched" class="text-danger">
            Use o formato "latitude, longitude"
      </ion-item>

  </form>
  <button ion-button block type="submit" margin-top [disabled] = "!form.valid" (click)="adicionarEvento()">{{ evento.key ? 'Salvar Alterações' : 'Adicionar Evento' }}</button>

</div>
</ion-content>
