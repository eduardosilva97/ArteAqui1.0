<ion-header>

  <ion-navbar>
    <ion-title>Editar Perfil</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding>
  <form #form="ngForm" novalidate>
    <ion-list>
    <ion-item>
        <ion-label stacked>Seu nome</ion-label>
        <ion-input type="text" name="nome" [(ngModel)]="user.nome" #nome="ngModel" required></ion-input>
      </ion-item>
      <ion-item *ngIf="nome.errors && (nome.dirty || nome.touched)" class="text-danger">
        O campo é obrigatório
      </ion-item>

      <ion-item>
        <ion-label stacked>Sua Idade</ion-label>
        <ion-input type="number" name="idade" [(ngModel)]="user.idade" #idade="ngModel" required></ion-input>
      </ion-item>
      <ion-item *ngIf="idade.errors && (idade.dirty || idade.touched)" class="text-danger">
        O campo é obrigatório
      </ion-item>
    </ion-list>

    <button ion-button block color="primary" [disabled]="!form.form.valid" (click)="salvar()">
      Salvar
    </button>
  </form>
</ion-content>
