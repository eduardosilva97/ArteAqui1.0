<ion-header>

  <ion-navbar>
    <ion-title>Perfil</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding>

  <ng-container *ngIf="usuario | async as u">
    <p text-center><ion-icon name="contact" class="avatar"></ion-icon></p>

    <h2 text-center>{{ u.nome || 'Sem nome' }}</h2>
    <p text-center>{{ u.email }}</p>
    <p text-center *ngIf="u.idade">Idade: {{ u.idade }}</p>

    <button ion-button block color="primary" (click)="editarPerfil()">Editar Perfil</button>
  </ng-container>

</ion-content>
