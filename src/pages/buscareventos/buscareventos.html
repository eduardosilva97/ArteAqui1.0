<ion-header>

  <ion-navbar>
    <ion-title>Buscar Eventos</ion-title>
  </ion-navbar>

</ion-header>


<ion-content >
  <ion-searchbar placeholder="Nome, local ou gênero" (ionInput)="searchAction($event)"></ion-searchbar>

  <ion-list>
    <button ion-item *ngFor="let evento of eventos" (click)="marcarEvento(evento)">
      <h2>{{ evento.eventoNome }}</h2>
      <p> Local: {{ evento.local }} </p>
      <p> Preço: {{ evento.preco > 0 ? 'R$ ' + evento.preco : 'Grátis' }} </p>
    </button>
    <ion-item *ngIf="!eventos.length" text-wrap>
      Nenhum evento encontrado.
    </ion-item>
  </ion-list>
</ion-content>
