
  <ion-header>
    <ion-navbar>
      <button ion-button menuToggle>
        <ion-icon name="menu"></ion-icon>
      </button>
      <ion-title>ArteAqui</ion-title>
      <ion-buttons end>
        <button ion-button (click)="marcaMapaTeste()">
          Marcadores
        </button>
      </ion-buttons>
    </ion-navbar>
  </ion-header>
  <ion-content>
    <div class="filtros">
      <button class="filtro" [class.ativo]="!filtro" (click)="filtrar(null)">Todos</button>
      <button *ngFor="let c of categorias" class="filtro" [class.ativo]="filtro === c.chave"
        [style.border-color]="c.cor" [style.background]="filtro === c.chave ? c.cor : null" (click)="filtrar(c.chave)">
        <ion-icon [name]="'md-' + c.icone" [style.color]="filtro === c.chave ? '#fff' : c.cor"></ion-icon>
        {{ c.nome }}
      </button>
    </div>
    <div #map id="map"></div>
  </ion-content>
