<ion-menu side="left" [content]="content">
        <ion-header>
          <ion-toolbar color='primary'>
            <ion-title>Menu</ion-title>
          </ion-toolbar>
        </ion-header>

<ion-content>
    <ion-list>
        <button color='light' ion-item (click)="perfil()" menuClose>
            Perfil
        </button>
        <button color='light' ion-item (click)="buscarEventos()" menuClose>
            Buscar Eventos
        </button>
        <button color='light' ion-item (click)="adicionarEvento()" menuClose>
            Adicionar Evento
        </button>
         <button color='light' ion-item (click)="signOut()" menuClose>
            Sair
         </button>
    </ion-list>
    <ion-toolbar color='cinzaclaro'>
        <p>Principais Eventos <small>(arraste para o lado para editar ou remover)</small></p>
    </ion-toolbar>
    <ion-list>
       <ion-item-sliding *ngFor="let evento of eventos | async">
            <button ion-item color='light' (click) = "detalharEvento(evento)" menuClose>
                <h2>{{ evento.eventoNome }}</h2>
                <p> Local: {{ evento.local }} </p>
                <p> Gênero: {{ evento.genero }} </p>
                <p> Preço: {{ evento.preco > 0 ? 'R$ ' + evento.preco : 'Grátis' }} </p>
           </button>
           <ion-item-options side="right">
                <button ion-button color="primary" (click)="editarEvento(evento)" menuClose>Editar</button>
                <button ion-button color="danger" (click)="removerEvento(evento.key)">Remover</button>
           </ion-item-options>
        </ion-item-sliding>
    </ion-list>
  </ion-content>

</ion-menu>
<ion-nav #content [root]="rootPage"  swipeBackEnabled="false"></ion-nav>
