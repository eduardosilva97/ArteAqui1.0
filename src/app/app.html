<!-- Em telas grandes o menu fica fixo ao lado do mapa -->
<ion-split-pane when="lg">
<ion-menu side="left" [content]="content">
        <ion-header>
          <ion-toolbar color='primary'>
            <ion-title>ArteAqui</ion-title>
          </ion-toolbar>
        </ion-header>

<ion-content>
    <ion-list>
        <button ion-item (click)="mapa()" menuClose>
            <ion-icon name="map" item-start></ion-icon>
            Mapa cultural
        </button>
        <button ion-item (click)="buscarEventos()" menuClose>
            <ion-icon name="search" item-start></ion-icon>
            Buscar
        </button>
        <button ion-item (click)="adicionarEvento()" menuClose>
            <ion-icon name="add-circle" item-start></ion-icon>
            Adicionar evento
        </button>
        <ng-container *ngIf="usuario | async as u; else semConta">
            <button ion-item (click)="perfil()" menuClose>
                <ion-icon name="contact" item-start></ion-icon>
                Perfil <p>{{ u.nome || u.email }}</p>
            </button>
            <button ion-item (click)="signOut()" menuClose>
                <ion-icon name="log-out" item-start></ion-icon>
                Sair
            </button>
        </ng-container>
        <ng-template #semConta>
            <button ion-item (click)="entrar()" menuClose>
                <ion-icon name="log-in" item-start></ion-icon>
                Entrar ou criar conta
            </button>
        </ng-template>
    </ion-list>

    <ion-list *ngIf="(eventos | async)?.length">
       <ion-list-header>
          Meus eventos <small>(arraste para o lado para editar ou remover)</small>
       </ion-list-header>
       <ion-item-sliding *ngFor="let evento of eventos | async">
            <button ion-item (click) = "detalharEvento(evento)" menuClose>
                <ion-icon [name]="'md-' + categoria(evento.categoria).icone" [style.color]="categoria(evento.categoria).cor" item-start></ion-icon>
                <h2>{{ evento.eventoNome }}</h2>
                <p>{{ evento.local }}</p>
           </button>
           <ion-item-options side="right">
                <button ion-button color="primary" (click)="editarEvento(evento)" menuClose>Editar</button>
                <button ion-button color="danger" (click)="removerEvento(evento.key)">Remover</button>
           </ion-item-options>
        </ion-item-sliding>
    </ion-list>
  </ion-content>

</ion-menu>
<ion-nav #content [root]="rootPage" main swipeBackEnabled="false"></ion-nav>
</ion-split-pane>
